<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shape Tower</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#fff}
canvas{border:2px solid #444;background:#0f0f23}
#ui{margin-left:20px;width:200px}
#ui h1{font-size:24px;margin-bottom:10px;color:#e0e0ff}
#ui p{margin:4px 0;font-size:16px}
#next{border:1px solid #333;margin:10px 0;background:#0f0f23}
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="ui">
<h1>Shape Tower</h1>
<p>Score: <span id="score">0</span></p>
<p>Level: <span id="level">1</span></p>
<p>Lines: <span id="lines">0</span></p>
<p style="margin-top:10px">Next:</p>
<canvas id="next" width="150" height="150"></canvas>
<div id="controls" style="margin-top:15px;font-size:12px;color:#888">
<p>&larr;&rarr; Move</p><p>&uarr; Rotate</p><p>&darr; Soft drop</p><p>Space Hard drop</p><p>P Pause</p>
</div>
</div>
<script>
const COLS=10,ROWS=20,SZ=30;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const ncanvas=document.getElementById('next'),nctx=ncanvas.getContext('2d');
canvas.width=COLS*SZ;canvas.height=ROWS*SZ;
const SHAPES=[
{name:'Chair',color:'#e74c3c',blocks:[[1,0],[1,0],[1,1],[0,1]]},
{name:'Table',color:'#3498db',blocks:[[1,0,1],[1,1,1]]},
{name:'Scissors',color:'#f1c40f',blocks:[[0,1,0],[1,1,1],[0,1,0]]},
{name:'Hockey Stick',color:'#2ecc71',blocks:[[1,0],[1,0],[1,0],[1,1]]},
{name:'Boomerang',color:'#9b59b6',blocks:[[1,0],[1,1],[0,1]]},
{name:'Bracket',color:'#e67e22',blocks:[[1,1],[1,0],[1,0],[1,1]]}
];
let grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
let score=0,lines=0,level=1,gameOver=false,paused=false,introScreen=true;
let cur=null,nx=null,dropTimer=0,dropInterval=1000;

function randShape(){const s=SHAPES[Math.floor(Math.random()*SHAPES.length)];return{blocks:s.blocks.map(r=>[...r]),color:s.color,name:s.name,x:Math.floor((COLS-s.blocks[0].length)/2),y:0};}
function rotate(blocks){const rows=blocks.length,cols=blocks[0].length;const r=Array.from({length:cols},()=>Array(rows).fill(0));for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)r[x][rows-1-y]=blocks[y][x];return r;}
function valid(blocks,px,py){for(let y=0;y<blocks.length;y++)for(let x=0;x<blocks[y].length;x++){if(!blocks[y][x])continue;const nx2=px+x,ny=py+y;if(nx2<0||nx2>=COLS||ny>=ROWS)return false;if(ny>=0&&grid[ny][nx2])return false;}return true;}
function place(){for(let y=0;y<cur.blocks.length;y++)for(let x=0;x<cur.blocks[y].length;x++){if(!cur.blocks[y][x])continue;const gy=cur.y+y;if(gy<0){gameOver=true;return;}grid[gy][cur.x+x]=cur.color;}}
function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--){if(grid[y].every(c=>c)){grid.splice(y,1);grid.unshift(Array(COLS).fill(0));cleared++;y++;}}if(cleared){lines+=cleared;score+=cleared*cleared*100;level=Math.floor(lines/10)+1;dropInterval=Math.max(100,1000-level*80);}}
function spawn(){cur=nx||randShape();nx=randShape();if(!valid(cur.blocks,cur.x,cur.y))gameOver=true;}
function ghostY(){let gy=cur.y;while(valid(cur.blocks,cur.x,gy+1))gy++;return gy;}
function drawBlock(c,x,y,clr,sz){c.fillStyle=clr;c.fillRect(x*sz,y*sz,sz-1,sz-1);c.fillStyle='rgba(255,255,255,0.15)';c.fillRect(x*sz,y*sz,sz-1,3);}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(grid[y][x])drawBlock(ctx,x,y,grid[y][x],SZ);else{ctx.fillStyle='#16162e';ctx.fillRect(x*SZ,y*SZ,SZ-1,SZ-1);}}
if(!cur)return;
const gy=ghostY();for(let y=0;y<cur.blocks.length;y++)for(let x=0;x<cur.blocks[y].length;x++){if(cur.blocks[y][x]){ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect((cur.x+x)*SZ,(gy+y)*SZ,SZ-1,SZ-1);}}
for(let y=0;y<cur.blocks.length;y++)for(let x=0;x<cur.blocks[y].length;x++){if(cur.blocks[y][x])drawBlock(ctx,cur.x+x,cur.y+y,cur.color,SZ);}
nctx.clearRect(0,0,150,150);if(nx){const ox=Math.floor((150-nx.blocks[0].length*25)/2),oy=Math.floor((150-nx.blocks.length*25)/2);for(let y=0;y<nx.blocks.length;y++)for(let x=0;x<nx.blocks[y].length;x++){if(nx.blocks[y][x])drawBlock(nctx,(ox/25)+x,(oy/25)+y,nx.color,25);}}
}
function drawIntro(){ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e0e0ff';ctx.font='bold 28px Segoe UI';ctx.textAlign='center';ctx.fillText('SHAPE TOWER',canvas.width/2,50);ctx.font='14px Segoe UI';ctx.fillStyle='#888';ctx.fillText('Press any key to start',canvas.width/2,canvas.height-30);
let sy=85;const bsz=18;
SHAPES.forEach(s=>{ctx.fillStyle=s.color;ctx.font='bold 14px Segoe UI';ctx.textAlign='left';ctx.fillText(s.name,20,sy+8);const ox=130;for(let y=0;y<s.blocks.length;y++)for(let x=0;x<s.blocks[y].length;x++){if(s.blocks[y][x]){ctx.fillStyle=s.color;ctx.fillRect(ox+x*bsz,sy-10+y*bsz,bsz-1,bsz-1);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(ox+x*bsz,sy-10+y*bsz,bsz-1,3);}}sy+=Math.max(s.blocks.length*bsz,25)+12;});}
function drawGameOver(){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e74c3c';ctx.font='bold 28px Segoe UI';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-20);ctx.fillStyle='#fff';ctx.font='18px Segoe UI';ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+15);ctx.fillStyle='#888';ctx.font='14px Segoe UI';ctx.fillText('Press R to restart',canvas.width/2,canvas.height/2+45);}
function drawPaused(){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 24px Segoe UI';ctx.textAlign='center';ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);}
function updateUI(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('lines').textContent=lines;}
function reset(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;lines=0;level=1;gameOver=false;paused=false;dropInterval=1000;cur=null;nx=null;spawn();updateUI();}

let lastTime=0;
function loop(time){requestAnimationFrame(loop);if(introScreen){drawIntro();return;}if(gameOver){draw();drawGameOver();return;}if(paused){draw();drawPaused();return;}
const dt=time-lastTime;lastTime=time;dropTimer+=dt;if(dropTimer>dropInterval){dropTimer=0;if(valid(cur.blocks,cur.x,cur.y+1)){cur.y++;}else{place();if(!gameOver){clearLines();spawn();}}}
draw();updateUI();}

document.addEventListener('keydown',e=>{if(introScreen){introScreen=false;reset();lastTime=performance.now();return;}
if(gameOver){if(e.key==='r'||e.key==='R'){reset();lastTime=performance.now();}return;}
if(e.key==='p'||e.key==='P'){paused=!paused;if(!paused)lastTime=performance.now();return;}
if(paused)return;
if(e.key==='ArrowLeft'&&valid(cur.blocks,cur.x-1,cur.y))cur.x--;
if(e.key==='ArrowRight'&&valid(cur.blocks,cur.x+1,cur.y))cur.x++;
if(e.key==='ArrowUp'){const r=rotate(cur.blocks);if(valid(r,cur.x,cur.y))cur.blocks=r;}
if(e.key==='ArrowDown'){if(valid(cur.blocks,cur.x,cur.y+1))cur.y++;score+=1;}
if(e.key===' '){e.preventDefault();while(valid(cur.blocks,cur.x,cur.y+1)){cur.y++;score+=2;}place();if(!gameOver){clearLines();spawn();}}
});
requestAnimationFrame(loop);
</script>
</body>
</html>
