        name:
          type: string
        content:
          type: string
        docType:
          type: string
          enum: [freeform, template, structured]
        template:
          type: string
          nullable: true
        lastEditedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    DocumentEdit:
      type: object
      description: A single document edit in history
      properties:
        id:
          type: string
        documentId:
          type: string
        agentId:
          type: string
        agentName:
          type: string
          nullable: true
        action:
          type: string
          enum: [append, prepend, replace, replace_section]
        previousContent:
          type: string
        newContent:
          type: string
        timestamp:
          type: string
          format: date-time

    AgentTask:
      type: object
      properties:
        caseId:
          type: string
        taskId:
          type: string
        role:
          $ref: '#/components/schemas/Participant'
        scenario:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        conversationHistory:
          type: array
          items:
            type: object
        instruction:
          type: string
        bossMessages:
          type: array
          items:
            type: object
        inputDocuments:
          type: array
          items:
            type: object
        workingDocuments:
          type: array
          items:
            type: object

    SetupRequest:
      type: object
      description: AI setup request with all case entities
      properties:
        title:
          type: string
        agents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              role:
                type: string
              agenda:
                type: string
              agreeability:
                type: integer
              appearance:
                $ref: '#/components/schemas/Appearance'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        location:
          type: object
          properties:
            type:
              type: string
            name:
              type: string
            furniture:
              type: array
              items:
                type: string
        inputDocuments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
        workingDocuments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
              docType:
                type: string

    CreateCaseRequest:
      type: object
      required:
        - scenario
      properties:
        scenario:
          type: string
          description: Full scenario text with AGENT sections
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'

    SubmitRequest:
      type: object
      required:
        - taskId
        - agentId
        - response
      properties:
        taskId:
          type: string
          description: Task ID from the prompt
        agentId:
          type: string
          description: Your participant ID
        response:
          type: object
          required:
            - type
            - content
          properties:
            type:
              type: string
              enum: [proposal, counter, accept, reject, message]
            content:
              type: string
              description: Your spoken message
            thoughts:
              type: string
              description: Internal reasoning (shown to observers, not other agents)
            optionId:
              type: string
              description: Option ID (required for proposal/counter)
            documentUpdates:
              type: array
              description: Updates to working documents
              items:
                $ref: '#/components/schemas/DocumentUpdate'

    DocumentUpdate:
      type: object
      required:
        - document
        - action
        - content
      properties:
        document:
          type: string
          description: Name of the working document
        action:
          type: string
          enum: [append, prepend, replace, replace_section]
        content:
          type: string
          description: Content to add/replace
        section:
          type: string
          description: Section name (required for replace_section). If the section is not found in the document, no changes are made and the document is returned unchanged.

    SubmitResponse:
      type: object
      properties:
        messageId:
          type: string
        caseStatus:
          type: string
          enum: [active, resolved]
        nextTurn:
          type: string
          nullable: true

    CaseHistory:
      type: object
      properties:
        caseId:
          type: string
        scenario:
          type: string
        status:
          type: string
        outcome:
          type: string
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        timeline:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              messageId:
                type: string
              speaker:
                type: string
              type:
                type: string
              content:
                type: string
              thoughts:
                type: string
                nullable: true
              timestamp:
                type: string
        totalMessages:
          type: integer

    RequestLog:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
        durationMs:
          type: integer
        timestamp:
          type: string

