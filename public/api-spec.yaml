                type: integer
              name:
                type: string
              status:
                type: string
              caseId:
                type: string
                nullable: true
              duration:
                type: string
                nullable: true
              turns:
                type: integer
                nullable: true
              outputDocument:
                type: string
              outputPreview:
                type: string
                nullable: true
        documents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              source:
                type: string
              stage:
                type: integer

    WorkflowOutput:
      type: object
      properties:
        workflowId:
          type: string
        status:
          type: string
        deliverables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
              producedBy:
                type: string
        summary:
          type: object
          properties:
            totalStages:
              type: integer
            totalDocuments:
              type: integer
            contributors:
              type: array
              items:
                type: string

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - stages
      properties:
        name:
          type: string
        description:
          type: string
        stages:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
              scenarioTemplate:
                type: string
              type:
                type: string
                enum: [collaborative, solo, review]
              agentCount:
                type: integer
              inputMapping:
                type: array
                items:
                  type: object
                  properties:
                    sourceStage:
                      type: integer
                    sourceDocument:
                      type: string
                    targetDocument:
                      type: string
                    targetType:
                      type: string
                      enum: [input, working]
              outputDocument:
                type: string

    WorkflowTemplateSummary:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        stages:
          type: integer
        inputCount:
          type: integer

    WorkflowTemplate:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        version:
          type: integer
        inputs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              required:
                type: boolean
        stages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              agentCount:
                type: integer
              output:
                type: string
        output:
          type: object
          properties:
            primary:
              type: string
            include:
              type: array
              items:
                type: string

    # ============================================
    # Goal Schemas
    # ============================================

    Goal:
      type: object
      properties:
        id:
          type: string
        goal:
          type: string
        goalType:
          type: string
          enum: [creative_writing, decision_making, problem_solving, document_creation, review_feedback]
        status:
          type: string
          enum: [planning, ready, active, completed, failed]
        plan:
          $ref: '#/components/schemas/WorkPlan'
        currentTaskId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateGoalRequest:
      type: object
      required:
        - goal
        - goalType
      properties:
        goal:
          type: string
          description: High-level objective
        goalType:
          type: string
          enum: [creative_writing, decision_making, problem_solving, document_creation, review_feedback]
        outputRequirements:
          type: object
          properties:
            format:
              type: string
            template:
              type: string
              nullable: true
            requirements:
              type: array
              items:
                type: string
            constraints:
              type: array
              items:
                type: string
        resources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [reference, template, example, constraint]
              content:
                type: string

    WorkPlan:
      type: object
      properties:
        approach:
          type: string
          description: AI-generated explanation of approach
        phases:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [collaborative, solo, review]
              purpose:
                type: string
              expectedOutput:
                type: string
              participantCount:
                type: integer
        estimatedTasks:
          type: integer

    GoalOutput:
      type: object
      properties:
        goalId:
          type: string
        goal:
          type: string
        status:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
        deliverables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              content:
                type: string
              producedBy:
                type: string
              version:
                type: integer

