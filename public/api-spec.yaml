  # ============================================
  # Goal Endpoints
  # ============================================

  /goals:
    get:
      summary: List all goals
      description: Returns all goals with their current status.
      tags: [Goals]
      parameters:
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [pending, planning, executing, completed, failed]
      responses:
        '200':
          description: List of goals
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'

    post:
      summary: Create a goal
      description: Creates a new high-level goal that can be decomposed into a workflow.
      tags: [Goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  description: Goal description
                context:
                  type: string
                  description: Additional context for planning
                constraints:
                  type: array
                  items:
                    type: string
                  description: Constraints to consider
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          description: Invalid request

  /goals/{id}:
    get:
      summary: Get goal details
      description: Returns goal with its plan and associated workflow.
      tags: [Goals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Goal ID
      responses:
        '200':
          description: Goal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '404':
          description: Goal not found

    delete:
      summary: Delete a goal
      description: Deletes a goal. Associated workflow is not deleted.
      tags: [Goals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Goal ID
      responses:
        '204':
          description: Goal deleted
        '404':
          description: Goal not found

  /goals/{id}/plan:
    put:
      summary: Set goal plan
      description: Sets the execution plan for a goal.
      tags: [Goals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Goal ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                      type:
                        type: string
                        enum: [collaborative, solo, review]
                      agentCount:
                        type: number
                estimatedDuration:
                  type: string
                risks:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Plan set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '404':
          description: Goal not found

  /goals/{id}/execute:
    post:
      summary: Execute goal
      description: Creates a workflow from the goal plan and starts execution.
      tags: [Goals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Goal ID
      responses:
        '200':
          description: Workflow created and started
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal:
                    $ref: '#/components/schemas/Goal'
                  workflow:
                    $ref: '#/components/schemas/WorkflowWithStages'
        '400':
          description: Goal has no plan or already executing
        '404':
          description: Goal not found

  /goals/{id}/output:
    put:
      summary: Set goal output
      description: Sets the final output/result of the goal.
      tags: [Goals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Goal ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output]
              properties:
                output:
                  type: string
                  description: Goal output/result
      responses:
        '200':
          description: Output set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '404':
          description: Goal not found

components:
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Case ID (e.g., "case-abc123")

  responses:
    CaseNotFound:
      description: Case not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    Case:
      type: object
      properties:
        id:
          type: string
        scenario:
          type: string
        status:
          type: string
          enum: [active, resolved, abandoned]
        currentTurn:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [agreed, failed, abandoned]
          nullable: true
        selectedOptionId:
          type: string
          nullable: true
        resolutionSummary:
          type: string
          nullable: true
        maxRounds:
          type: integer
          nullable: true
        taskType:
          type: string
          enum: [options, document, both]
          nullable: true
        taskOutput:
          type: string
          nullable: true
        locationType:
          type: string
          enum: [hospital, office, school, library, cafe, park, studio, courtroom, outdoor]
          nullable: true
        locationName:
          type: string
          nullable: true
        locationFurniture:
          type: array
          items:
            type: string
          nullable: true
        temperature:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Overall randomness for agent responses (0=deterministic, 1=creative)
        moodSwings:
          type: boolean
          default: false
          description: Whether agent moods evolve based on conversation
        randomEvents:
          type: boolean
          default: false
          description: Whether to inject random interruptions/events
        chaosLevel:
          type: string
          enum: [calm, normal, heated, chaotic]
          default: normal
          description: Overall unpredictability level
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseWithRelations:
      allOf:
        - $ref: '#/components/schemas/Case'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/Participant'
            options:
              type: array
              items:
                $ref: '#/components/schemas/Option'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            workingDocuments:
              type: array
              items:
                $ref: '#/components/schemas/WorkingDocument'
            bossMessages:
              type: array
              items:
                $ref: '#/components/schemas/BossMessage'

    Participant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        agenda:
          type: string
          description: Private agenda text
        role:
          type: string
          description: Display role (e.g., "Doctor", "Patient")
        preferences:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        isPayer:
          type: boolean
        agreeability:
          type: integer
          minimum: 0
          maximum: 100
        variability:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: How unpredictable this agent is (0=predictable, 1=chaotic)
        mood:
          type: string
          enum: [neutral, enthusiastic, skeptical, tired, frustrated, distracted, inspired]
          default: neutral
          description: Current emotional state affecting behavior
        quirks:
          type: array
          items:
            type: string
          description: Behavioral tendencies (e.g., "gets sidetracked by references")
        triggers:
          type: array
          items:
            type: string
          description: Topics that provoke strong reactions
        appearance:
          $ref: '#/components/schemas/Appearance'

    Appearance:
      type: object
      properties:
        accessory:
          type: string
        bodyStyle:
          type: string
        color:
          type: string

    AgentProfile:
      type: object
      description: Complete profile for a persistent agent with physical attributes, personality, and life history
      properties:
        name:
          type: string
          description: Unique agent identifier
        appearance:
          $ref: '#/components/schemas/Appearance'
        agenda:
          type: string
          nullable: true
        agreeability:
          type: integer
          nullable: true
        scenarioSource:
          type: string
          nullable: true

        # Identity
        dateOfBirth:
          type: string
          format: date
          nullable: true
        placeOfBirthCity:
          type: string
          nullable: true
        placeOfBirthCountry:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
        nationalities:
          type: array
          items:
            type: string
          nullable: true
        sex:
          type: string
          enum: [male, female, non-binary, other]
          nullable: true

        # Physical attributes
        heightCm:
          type: number
          nullable: true
        weightKg:
          type: number
          nullable: true
        build:
          type: string
          enum: [slim, athletic, average, stocky, heavyset, muscular]
          nullable: true
        skinTone:
          type: string
          nullable: true
        ageAppearance:
          type: integer
          nullable: true

        # Backstory & Personality
        backstory:
          type: string
          nullable: true
          description: Agent's background story
        personalityTraits:
          type: array
          items:
            type: string
          nullable: true
          description: List of personality traits

        # Life History
        childhoodSummary:
          type: string
          nullable: true
        childhoodLocation:
          type: string
          nullable: true
        familyBackground:
          type: string
          nullable: true
        education:
          type: array
          items:
            type: string
          nullable: true
          description: Schools, degrees, certifications
        careerPath:
          type: array
          items:
            type: string
          nullable: true
          description: Job history in chronological order
        significantEvents:
          type: array
          items:
            type: string
          nullable: true
        formativeExperiences:
          type: array
          items:
            type: string
          nullable: true
        currentSituation:
          type: string
          nullable: true
        fears:
          type: array
          items:
            type: string
          nullable: true
        desires:
          type: array
          items:
            type: string
          nullable: true
        secrets:
          type: array
          items:
            type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
          nullable: true
        hobbies:
          type: array
          items:
            type: string
          nullable: true

        # Photo
        photoUrl:
          type: string
          nullable: true
        photoPrompt:
          type: string
          nullable: true
          description: AI image generation prompt

        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Option:
      type: object
      description: An option to choose from
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        priceRange:
          type: string
        features:
          type: array
          items:
            type: string

    Message:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
          description: Participant ID
        type:
          type: string
          enum: [proposal, counter, accept, reject, message]
        content:
          type: string
        thoughts:
          type: string
          nullable: true
          description: Agent's internal reasoning (visible to observers)
        optionId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    BossMessage:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        targetAgent:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    InputDocument:
      type: object
