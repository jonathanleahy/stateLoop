openapi: 3.0.3
info:
  title: StateLoop API
  description: |
    Stateless agent orchestration API for multi-party negotiations.

    ## Core Concepts
    - **Cases**: Negotiation sessions with participants and options
    - **Participants**: Agents with private agendas
    - **Messages**: Proposals, counters, accepts, rejects
    - **Working Documents**: Collaborative documents agents can edit
    - **Input Documents**: Read-only reference materials

    ## Agent Workflow
    1. GET `/api/cases/{id}/auto-play` - Get your task prompt
    2. Process the prompt and decide your response
    3. POST `/api/cases/{id}/submit` - Submit your response
    4. Repeat until case resolves

    ## Documentation Resources
    - **API Docs (Swagger UI)**: [/api-docs](/api-docs) - Interactive API documentation
    - **Main UI**: [/](/index.html) - Negotiation visualization interface
    - **Config**: [/scenarios.html](/scenarios.html) - Scenario browser and agent customizer
    - **Companies**: [/companies.html](/companies.html) - Organization management
    - **Docs Viewer**: [/docs](/docs) - Markdown documentation browser

  version: 1.0.0
  contact:
    name: StateLoop

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /:
    get:
      summary: API welcome and discovery
      description: |
        Returns API overview, active cases, and available endpoints.
        This is a human-readable entry point for exploring the API.
      tags: [Admin]
      responses:
        '200':
          description: API welcome message with active cases list
          content:
            text/plain:
              schema:
                type: string

  /cases:
    get:
      summary: List all cases
      description: |
        Returns all negotiation cases in the system. Each case includes
        its current status, participants, and outcome if resolved.

        Use this to find existing cases or monitor active negotiations.
      tags: [Cases]
      responses:
        '200':
          description: Array of all cases with their current state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'

    post:
      summary: Create a new case
      description: |
        Creates a new negotiation case from a scenario description.

        The scenario text describes the situation, participants, and options.
        The system parses this to extract agents and choices. After creation,
        call `/api/cases/{id}/setup` to initialize agents and options via AI,
        or use the legacy format-based extraction.

        ## Example Scenario
        ```
        PUBLIC INFO:
        Team deciding on project approach.

        OPTIONS:
        - Agile: 2-week sprints
        - Waterfall: Detailed planning

        AGENT: Alice
        AGENDA: Prefers structured approaches.
        AGREEABILITY: 60

        AGENT: Bob
        AGENDA: Loves flexibility.
        AGREEABILITY: 50
        ```
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created successfully with parsed scenario data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'

  /cases/{id}:
    get:
      summary: Get case details
      description: |
        Returns full details of a specific case including:
        - Scenario text and metadata
        - List of participants with their IDs
        - Available options to choose from
        - Complete message history
        - Current turn indicator
        - Resolution status and outcome

        Use this to get the current state of a negotiation.
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Full case details with all related data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'
        '404':
          $ref: '#/components/responses/CaseNotFound'

  /cases/{id}/history:
    get:
      summary: Get conversation history for playback
      description: |
        Returns the complete conversation history optimized for UI playback.
        Includes message sequence, speaker information, and timing data.

        Use this to replay a conversation or export the transcript.
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Complete conversation timeline with message metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHistory'

  /cases/{id}/next-task:
    get:
      summary: Get next task for polling
      description: |
        Returns the next available task if one exists. Used by automated
        systems to poll for work. Prefer `/auto-play` for LLM-driven workflows.

        Returns 204 No Content if no task is available (case resolved or
        not your turn).
      tags: [Agent Actions]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Task available with agent context and instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTask'
        '204':
          description: No task available (case resolved or between turns)

  /cases/{id}/auto-play:
    get:
      summary: Get agent prompt for current turn
      description: |
        Returns a formatted prompt for the current agent's turn.
        The prompt includes:
        - Agent's private agenda
        - Conversation history
        - Available options
        - Working documents
        - Instructions for responding
      tags: [Agent Actions]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Agent prompt (text/plain)
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: No task available (not your turn or case resolved)
        '404':
          $ref: '#/components/responses/CaseNotFound'

    post:
      summary: Get agent prompt (POST method)
      description: Same as GET but accepts POST for compatibility
      tags: [Agent Actions]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Agent prompt (text/plain)
          content:
            text/plain:
              schema:
                type: string

  /cases/{id}/submit:
    post:
      summary: Submit agent response
      description: |
        Submit your response to the current task. Include document updates
        to collaborate on shared working documents.

        ## Response Types
        - `proposal` - Suggest an option (requires optionId)
        - `counter` - Counter-propose different option (requires optionId)
        - `accept` - Accept the current proposal (resolves case if proposer differs)
        - `reject` - Reject without alternative
        - `message` - General comment or question

        ## Document Updates
        Include `documentUpdates` array to edit working documents:
        - `append` - Add content to end
        - `prepend` - Add content to beginning
        - `replace` - Replace entire document
        - `replace_section` - Replace a specific section (requires `section` field). Note: If the specified section is not found, the document is returned unchanged and a warning is logged server-side.

      tags: [Agent Actions]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '200':
          description: Response accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
            text/plain:
              schema:
                type: string
                description: When case is still active, includes next agent's prompt
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '409':
          description: Not your turn or case already resolved
        '410':
          description: Task expired

  /cases/{id}/resolve:
    post:
      summary: Manually resolve a case
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - outcome
              properties:
                outcome:
                  type: string
                  enum: [agreed, failed, abandoned]
                selectedOptionId:
                  type: string
                  nullable: true
                summary:
                  type: string
      responses:
        '200':
          description: Case resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'

  /cases/{id}/boss-message:
    post:
      summary: Send a boss message to agents
      description: Boss messages are private guidance visible to agents but not part of the conversation
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                targetAgent:
                  type: string
                  description: Optional - target specific agent by ID
      responses:
        '201':
          description: Boss message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    type: string
                  timestamp:
                    type: string

  /cases/{id}/agent-prompt:
    get:
      summary: Get raw agent prompt
      tags: [Agent Actions]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: agentId
          in: query
          schema:
            type: string
          description: Optional agent ID to get prompt for
      responses:
        '200':
          description: Agent prompt text
          content:
            text/plain:
              schema:
                type: string

  /cases/{id}/set-appearance:
    post:
      summary: Set agent appearance
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agentId
              properties:
                agentId:
                  type: string
                accessory:
                  type: string
                bodyStyle:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: Appearance updated

  /cases/{id}/add-option:
    post:
      summary: Add an option to the case
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Option'
      responses:
        '201':
          description: Option added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Option'

  /cases/{id}/reset:
    post:
      summary: Reset case messages (keep agents/options)
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'

  /cases/{id}/reopen:
    post:
      summary: Reopen a resolved case
      description: |
        Reopens a resolved case for continued discussion.
        Automatically increases MAX_ROUNDS by 10 (configurable) to prevent immediate timeout.
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for reopening
                  default: "Manually reopened"
                additionalRounds:
                  type: integer
                  description: Extra rounds to add to MAX_ROUNDS
                  default: 10
      responses:
        '200':
          description: Case reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  caseId:
                    type: string
                  currentTurn:
                    type: string
                  additionalRounds:
                    type: integer
                  reason:
                    type: string

  /cases/{id}/run:
    post:
      summary: Run case to completion (simulation)
      description: |
        Automatically runs the case using built-in response generation.
        Useful for testing scenarios without external LLM.

        **Document Writing:** When working documents exist, the simulation
        automatically writes to them based on message type.
      tags: [Simulation]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: maxRounds
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum rounds before stopping
      responses:
        '200':
          description: Simulation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [resolved, active, already_resolved]
                  outcome:
                    type: string
                    enum: [agreed, failed]
                    nullable: true
                  rounds:
                    type: integer
                  messageCount:
                    type: integer
                  log:
                    type: array
                    items:
                      type: string

  /cases/{id}/agents:
    post:
      summary: Add agents to case (bulk)
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agents:
                  type: array
                  items:
                    $ref: '#/components/schemas/Participant'
      responses:
        '200':
          description: Agents added

  /cases/{id}/options:
    post:
      summary: Add options to case (bulk)
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: array
                  items:
                    $ref: '#/components/schemas/Option'
      responses:
        '200':
          description: Options added

  /cases/{id}/setup:
    post:
      summary: AI setup - bulk create all case entities
      description: |
        Used by AI to submit complete case setup including agents, options,
        documents, and location in a single request.

        ## Validation
        The request is validated before processing. If validation fails, a 400 response
        is returned with detailed error messages so the AI can fix and retry.

        ### Required Fields
        - `setup.agents` - At least 2 agents with `name` and `agenda`
        - `setup.options` - Required if taskType is 'options' or 'both'
        - `firstAgent.name` - Must match an agent name
        - `firstAgent.message` - Opening message text

        ### Validated Fields
        - `agreeability` must be 0-100 if provided
        - Agent names must be non-empty strings
        - Option names must be non-empty strings
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/CaseNotFound'

  /cases/{id}/input-documents:
    get:
      summary: List input documents
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Input documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InputDocument'

    post:
      summary: Add input document
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - content
              properties:
                name:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: Document added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputDocument'

  /cases/{id}/input-documents/{name}:
    get:
      summary: Get input document by name
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputDocument'
        '404':
          description: Document not found

  /cases/{id}/documents:
    get:
      summary: Get all documents for a case
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: All documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  input:
                    type: array
                    items:
                      $ref: '#/components/schemas/InputDocument'
                  working:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkingDocument'

    post:
      summary: Create working document
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                content:
                  type: string
                  default: ""
                docType:
                  type: string
                  enum: [freeform, template, structured]
                  default: freeform
                template:
                  type: string
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDocument'

  /cases/{id}/documents/{name}:
    get:
      summary: Get working document by name
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDocument'
        '404':
          description: Document not found

    put:
      summary: Replace working document content
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDocument'

    patch:
      summary: Patch working document (append/prepend/replace_section)
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Document patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDocument'

  /cases/{id}/documents/{name}/history:
    get:
      summary: Get document edit history
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Edit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentEdit'

  /cases/{id}/output:
    get:
      summary: Get case output document
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Output document
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                    nullable: true

    post:
      summary: Set case output document
      tags: [Cases]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - output
              properties:
                output:
                  type: string
      responses:
        '200':
          description: Output set

  /auto-play:
    get:
      summary: Global auto-play - find any case needing action
      tags: [Agent Actions]
      responses:
        '200':
          description: Agent prompt for next available case
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: No cases need action

  /scenarios:
    get:
      summary: List available scenarios
      tags: [Scenarios]
      responses:
        '200':
          description: List of scenario names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /scenarios/{name}:
    get:
      summary: Get scenario content
      tags: [Scenarios]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario content
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Scenario not found

  /scenarios/{name}/load:
    post:
      summary: Load a scenario as a new case
      tags: [Scenarios]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Case created from scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseWithRelations'

  /validate-scenario:
    post:
      summary: Validate scenario text
      tags: [Scenarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scenario
              properties:
                scenario:
                  type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  parsed:
                    type: object
                    description: Parsed scenario data if valid

  /furniture:
    get:
      summary: Get furniture catalog
      description: Returns all available furniture items by category for scene setup
      tags: [Admin]
      responses:
        '200':
          description: Furniture catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        icon:
                          type: string
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              description:
                                type: string
                              size:
                                type: object
                                properties:
                                  w:
                                    type: integer
                                  h:
                                    type: integer

  /agents:
    get:
      summary: List saved agent templates
      tags: [Agents]
      responses:
        '200':
          description: List of agent names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /agents/{name}:
    get:
      summary: Get agent template
      tags: [Agents]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent template
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Agent not found

    delete:
      summary: Delete agent template
      tags: [Agents]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted
        '404':
          description: Agent not found

  /agents/{name}/history:
    get:
      summary: Get agent conversation history
      tags: [Agents]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    role:
                      type: string
                    content:
                      type: string

    post:
      summary: Add to agent conversation history
      tags: [Agents]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - content
              properties:
                role:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: History updated

  /agents/{name}/profile:
    get:
      summary: Get agent profile
      tags: [Agents]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '404':
