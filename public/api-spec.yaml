          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ValidationError:
      type: object
      description: |
        Returned when AI submits invalid JSON structure.
        The `details` array lists ALL validation issues (not just the first),
        allowing the AI to fix everything in a single retry.
      properties:
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Validation failed"
        details:
          type: array
          description: List of all validation errors found
          items:
            type: string
          example:
            - "Agent 'Alice' missing required field: agenda"
            - "Agent 'Bob' agreeability must be 0-100, got: 150"
        hint:
          type: string
          description: Actionable guidance for fixing the errors
          example: "Fix the issues above and resubmit. Available option IDs: case-123-rest-1, case-123-rest-2"

    JSONParseError:
      type: object
      description: Returned when request body is not valid JSON
      properties:
        error:
          type: string
          example: "JSON_PARSE_ERROR"
        message:
          type: string
          example: "Invalid JSON in request body"
        details:
          type: string
          description: The JSON parse error message
          example: "Unexpected token 'x' at position 123"
        hint:
          type: string
          example: "Ensure the request body is valid JSON. Common issues: unescaped quotes, trailing commas, single quotes instead of double quotes."

