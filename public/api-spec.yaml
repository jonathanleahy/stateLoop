  # ============================================
  # Workflow Endpoints
  # ============================================

  /workflows:
    get:
      summary: List all workflows
      description: Returns all workflows with their current status.
      tags: [Workflows]
      parameters:
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [pending, active, completed, failed]
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'

    post:
      summary: Create a workflow
      description: Creates a new workflow, optionally from a template.
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Workflow name
                description:
                  type: string
                  description: Workflow description
                templateName:
                  type: string
                  description: Template to use (optional)
                stages:
                  type: array
                  description: Custom stages (if not using template)
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [collaborative, solo, review]
                      description:
                        type: string
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid request

  /workflows/{id}:
    get:
      summary: Get workflow details
      description: Returns workflow with its stages and current status.
      tags: [Workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
      responses:
        '200':
          description: Workflow details with stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWithStages'
        '404':
          description: Workflow not found

    delete:
      summary: Delete a workflow
      description: Deletes a workflow and all its stages.
      tags: [Workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
      responses:
        '204':
          description: Workflow deleted
        '404':
          description: Workflow not found

  /workflows/{id}/start:
    post:
      summary: Start a workflow
      description: Activates a pending workflow and sets its inputs.
      tags: [Workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties:
                    type: string
                  description: Input parameters for the workflow
      responses:
        '200':
          description: Workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWithStages'
        '400':
          description: Workflow cannot be started
        '404':
          description: Workflow not found

  /workflows/{id}/stages/{stageId}/complete:
    post:
      summary: Complete a workflow stage
      description: Marks a stage as completed and advances to the next stage.
      tags: [Workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
        - name: stageId
          in: path
          required: true
          schema:
            type: string
          description: Stage ID
      responses:
        '200':
          description: Stage completed, workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowWithStages'
        '400':
          description: Stage cannot be completed
        '404':
          description: Workflow or stage not found

  /workflows/{id}/outputs:
    put:
      summary: Set workflow outputs
      description: Sets or updates the workflow outputs.
      tags: [Workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Workflow ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Outputs updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found

  # ============================================
  # Workflow Template Endpoints
  # ============================================

  /workflow-templates:
    get:
      summary: List workflow templates
      description: Returns all available workflow templates that can be used to create workflows.
      tags: [Workflows]
      responses:
        '200':
          description: List of workflow templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        stageCount:
                          type: number

  /workflow-templates/{name}:
    get:
      summary: Get workflow template
      description: Returns details of a specific workflow template including its stages.
      tags: [Workflows]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Template name/ID
      responses:
        '200':
          description: Workflow template details
