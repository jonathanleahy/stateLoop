<!DOCTYPE html>
<html>
<head>
  <title>Top-Down Racer</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 2px solid #333; }
    #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 16px; }
    #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 72px; font-weight: bold; text-shadow: 2px 2px 4px black; }
    #viewMode { position: absolute; top: 20px; right: 20px; color: #0f0; font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="ui">
    <div>Position: <span id="position">-</span></div>
    <div>Lap: <span id="lap">0</span>/3</div>
    <div>Time: <span id="time">0.00</span></div>
    <div>Speed: <span id="speed">0</span></div>
  </div>
  <div id="viewMode">View: TOP-DOWN (V to toggle)</div>
  <div id="countdown"></div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const CX = W / 2, CY = H / 2;

    // Track parameters (oval)
    const TRACK_RX = 350, TRACK_RY = 250;
    const TRACK_WIDTH = 80;
    const INNER_RX = TRACK_RX - TRACK_WIDTH, INNER_RY = TRACK_RY - TRACK_WIDTH;
    const OUTER_RX = TRACK_RX + TRACK_WIDTH, OUTER_RY = TRACK_RY + TRACK_WIDTH;

    // Isometric view toggle
    let isometricView = false;
    const ISO_ANGLE = Math.PI / 6; // 30 degrees
    const ISO_SCALE_Y = 0.5;

    // Transform coordinates for isometric view
    function iso(x, y) {
      if (!isometricView) return { x, y };
      const cx = x - CX, cy = y - CY;
      const isoX = (cx - cy) * Math.cos(ISO_ANGLE);
      const isoY = (cx + cy) * Math.sin(ISO_ANGLE) * ISO_SCALE_Y;
      return { x: CX + isoX, y: CY + isoY + 50 };
    }

    // Get depth value for sorting (higher = drawn later = in front)
    function getDepth(car) {
      // In our isometric view, higher screen Y should be in front
      // isoY increases with (x + y), so sort by negative to draw far objects first
      return car.y - car.x;
    }

    // Draw isometric ellipse (approximation with points)
    function drawIsoEllipse(rx, ry, fill = true) {
      ctx.beginPath();
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * Math.PI * 2;
        const px = CX + Math.cos(a) * rx;
        const py = CY + Math.sin(a) * ry;
        const p = iso(px, py);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      if (fill) ctx.fill();
      else ctx.stroke();
    }

    // Car class
    class Car {
      constructor(color, isPlayer = false) {
        this.color = color;
        this.isPlayer = isPlayer;
        this.x = CX;
        this.y = CY + TRACK_RY;
        this.angle = -Math.PI / 2;
        this.speed = 0;
        this.maxSpeed = isPlayer ? 5 : 4 + Math.random();
        this.acceleration = 0.1;
        this.friction = 0.98;
        this.turnSpeed = 0.05;
        this.lap = 0;
        this.checkpoint = false;
        this.finished = false;
        this.finishTime = 0;
      }

      update(keys) {
        if (this.isPlayer) {
          if (keys.up) this.speed = Math.min(this.speed + this.acceleration, this.maxSpeed);
          if (keys.down) this.speed = Math.max(this.speed - this.acceleration, -this.maxSpeed / 2);
          if (keys.left) this.angle -= this.turnSpeed * (this.speed / this.maxSpeed);
          if (keys.right) this.angle += this.turnSpeed * (this.speed / this.maxSpeed);
        } else {
          this.updateAI();
        }
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.checkTrackBounds();
        this.checkLap();
      }

      updateAI() {
        const targetAngle = Math.atan2(-this.y + CY, -this.x + CX) + Math.PI / 2;
        let diff = targetAngle - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.turnSpeed);
        this.speed = Math.min(this.speed + this.acceleration * 0.8, this.maxSpeed);
      }

      checkTrackBounds() {
        const dx = (this.x - CX) / TRACK_RX;
        const dy = (this.y - CY) / TRACK_RY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const innerDist = Math.sqrt(Math.pow((this.x - CX) / INNER_RX, 2) + Math.pow((this.y - CY) / INNER_RY, 2));
        const outerDist = Math.sqrt(Math.pow((this.x - CX) / OUTER_RX, 2) + Math.pow((this.y - CY) / OUTER_RY, 2));
        if (innerDist < 1 || outerDist > 1) {
          this.speed *= 0.5;
          const pushAngle = Math.atan2(this.y - CY, this.x - CX);
          const targetDist = TRACK_RX;
          this.x = CX + Math.cos(pushAngle) * targetDist * (innerDist < 1 ? 1.1 : 0.9);
          this.y = CY + Math.sin(pushAngle) * (targetDist * TRACK_RY / TRACK_RX) * (innerDist < 1 ? 1.1 : 0.9);
        }
      }

      checkLap() {
        if (this.x > CX - 50 && this.x < CX + 50) {
          if (this.y < CY && !this.checkpoint) this.checkpoint = true;
          if (this.y > CY + TRACK_RY - 30 && this.checkpoint) {
            this.lap++;
            this.checkpoint = false;
            if (this.lap >= 3 && !this.finished) {
              this.finished = true;
              this.finishTime = gameTime;
            }
          }
        }
      }

      draw() {
        const p = iso(this.x, this.y);
        // Shadow (projected in screen space so it always sits under the car)
        ctx.save();
        ctx.translate(p.x, p.y + (isometricView ? 6 : 3));
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.scale(isometricView ? 1.1 : 1, isometricView ? 0.55 : 0.4);
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(p.x, p.y);
        let drawAngle = this.angle + Math.PI / 2;
        if (isometricView) {
          drawAngle = this.angle - ISO_ANGLE + Math.PI / 2;
        }
        ctx.rotate(drawAngle);
        if (isometricView) ctx.scale(1, 0.7);
        ctx.fillStyle = this.color;
        ctx.fillRect(-8, -15, 16, 30);
        ctx.fillStyle = "#222";
        ctx.fillRect(-6, -12, 12, 8);
        ctx.fillStyle = "#fff";
        ctx.fillRect(-4, 10, 3, 4);
        ctx.fillRect(1, 10, 3, 4);
        ctx.restore();
      }
    }

    // Game state
    let gameState = "countdown";
    let countdownValue = 3;
    let gameTime = 0;
    let lastTime = 0;
    const keys = { up: false, down: false, left: false, right: false };

    // Create cars
    const player = new Car("#ff0000", true);
    const aiCars = [
      new Car("#0066ff"),
      new Car("#ffcc00"),
      new Car("#00cc66")
    ];
    const allCars = [player, ...aiCars];

    // Position cars at start
    function resetRace() {
      player.x = CX - 20; player.y = CY + TRACK_RY + 10; player.angle = -Math.PI / 2; player.speed = 0; player.lap = 0; player.checkpoint = false; player.finished = false;
      aiCars[0].x = CX + 20; aiCars[0].y = CY + TRACK_RY + 10; aiCars[0].angle = -Math.PI / 2; aiCars[0].speed = 0; aiCars[0].lap = 0; aiCars[0].checkpoint = false; aiCars[0].finished = false;
      aiCars[1].x = CX - 20; aiCars[1].y = CY + TRACK_RY + 40; aiCars[1].angle = -Math.PI / 2; aiCars[1].speed = 0; aiCars[1].lap = 0; aiCars[1].checkpoint = false; aiCars[1].finished = false;
      aiCars[2].x = CX + 20; aiCars[2].y = CY + TRACK_RY + 40; aiCars[2].angle = -Math.PI / 2; aiCars[2].speed = 0; aiCars[2].lap = 0; aiCars[2].checkpoint = false; aiCars[2].finished = false;
      gameTime = 0;
      gameState = "countdown";
      countdownValue = 3;
    }

    // Draw track
    function drawTrack() {
      // Grass
      ctx.fillStyle = "#228B22";
      ctx.fillRect(0, 0, W, H);

      if (isometricView) {
        // Isometric track
        ctx.fillStyle = "#444";
        drawIsoEllipse(OUTER_RX, OUTER_RY, true);
        ctx.fillStyle = "#228B22";
        drawIsoEllipse(INNER_RX, INNER_RY, true);
        // Center line
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.setLineDash([20, 20]);
      drawIsoEllipse(TRACK_RX, TRACK_RY, false);
      ctx.setLineDash([]);
      // Finish line
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = i % 2 === 0 ? "#fff" : "#000";
        const p = iso(CX - 40 + i * 10 + 5, CY + TRACK_RY);
        ctx.fillRect(p.x - 5, p.y - 3, 10, 6);
      }
    } else {
        // Top-down track
        ctx.fillStyle = "#444";
        ctx.beginPath();
        ctx.ellipse(CX, CY, OUTER_RX, OUTER_RY, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#228B22";
        ctx.beginPath();
        ctx.ellipse(CX, CY, INNER_RX, INNER_RY, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.ellipse(CX, CY, TRACK_RX, TRACK_RY, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 8; i++) {
          ctx.fillStyle = i % 2 === 0 ? "#fff" : "#000";
          ctx.fillRect(CX - 40 + i * 10, CY + TRACK_RY - 5, 10, 10);
        }
      }
    }

    // Update UI
    function updateUI() {
      const positions = [...allCars].sort((a, b) => {
        if (a.lap !== b.lap) return b.lap - a.lap;
        return b.checkpoint - a.checkpoint;
      });
      const pos = positions.indexOf(player) + 1;
      document.getElementById("position").textContent = pos + ["st", "nd", "rd", "th"][Math.min(pos - 1, 3)];
      document.getElementById("lap").textContent = Math.min(player.lap + 1, 3);
      document.getElementById("time").textContent = gameTime.toFixed(2);
      document.getElementById("speed").textContent = Math.round(Math.abs(player.speed) * 20);
      document.getElementById("viewMode").textContent = "View: " + (isometricView ? "ISOMETRIC" : "TOP-DOWN") + " (V to toggle)";
    }

    // Draw cars with proper depth sorting
    function drawCars() {
      if (isometricView) {
        // Sort by depth: cars with higher (y - x) are further back and drawn first
        const sortedCars = [...allCars].sort((a, b) => getDepth(a) - getDepth(b));
        sortedCars.forEach(car => car.draw());
      } else {
        allCars.forEach(car => car.draw());
      }
    }

    // Game loop
    function gameLoop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (gameState === "countdown") {
        drawTrack();
        drawCars();
        document.getElementById("countdown").textContent = countdownValue > 0 ? countdownValue : "GO!";
        if (countdownValue <= 0) {
          setTimeout(() => { gameState = "racing"; document.getElementById("countdown").textContent = ""; }, 500);
        }
      } else if (gameState === "racing") {
        gameTime += dt;
        allCars.forEach(car => car.update(keys));
        drawTrack();
        drawCars();
        updateUI();
        if (player.finished) gameState = "finished";
      } else if (gameState === "finished") {
        drawTrack();
        drawCars();
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        ctx.font = "48px monospace";
        ctx.textAlign = "center";
        ctx.fillText("RACE COMPLETE!", CX, CY - 40);
        ctx.font = "24px monospace";
        ctx.fillText("Time: " + player.finishTime.toFixed(2) + "s", CX, CY + 10);
        ctx.fillText("Press R to restart", CX, CY + 50);
      }

      requestAnimationFrame(gameLoop);
    }

    // Countdown timer
    setInterval(() => { if (gameState === "countdown" && countdownValue > 0) countdownValue--; }, 1000);

    // Controls
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") keys.up = true;
      if (e.key === "ArrowDown") keys.down = true;
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === "r" || e.key === "R") resetRace();
      if (e.key === "v" || e.key === "V") {
        isometricView = !isometricView;
        updateUI();
      }
    });
    document.addEventListener("keyup", e => {
      if (e.key === "ArrowUp") keys.up = false;
      if (e.key === "ArrowDown") keys.down = false;
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
    });

    resetRace();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
