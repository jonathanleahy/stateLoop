<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Balloon Stacker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
canvas { border-radius: 12px; box-shadow: 0 0 40px rgba(99, 102, 241, 0.3); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, GND;
function resize() { const s = Math.min(innerWidth * .95, 420); W = c.width = s; H = c.height = s * 1.6; GND = H - 28; }
resize(); addEventListener('resize', resize);
const P = [
  { col: '#FF6B6B', buo: 1.0,  lb: 'Red',    desc: 'very high lift' },
  { col: '#4ECDC4', buo: .75,  lb: 'Teal',   desc: 'high lift' },
  { col: '#45B7D1', buo: .5,   lb: 'Blue',   desc: 'medium lift' },
  { col: '#FFEAA7', buo: .3,   lb: 'Yellow', desc: 'low lift' },
  { col: '#DDA0DD', buo: .15,  lb: 'Purple', desc: 'almost none' },
];
let st = 'intro', sc = 0, hi = 0, tw = [], dr = null, lift = 0, keys = {}, nx = 0, reason = '', pts = [];
const mkB = () => { const p = P[Math.random() * 5 | 0], r = 16 + Math.random() * 12;
  return { x: W * .2 + Math.random() * W * .6, y: -40, r, col: p.col, buo: p.buo * (r / 20), wt: .2 + Math.random() * .6, so: Math.random() * 7, dy: 0, sp: Math.random() * 7 }; };
const totB = () => tw.reduce((a, b) => a + b.buo, 0);
const totW = () => tw.reduce((a, b) => a + b.wt, 0);
const nf = () => totB() - totW();
const tH = () => tw.reduce((a, b) => a + b.r * 2 + 3, 0);
function go() { tw = []; sc = 0; lift = 0; pts = []; reason = ''; st = 'play'; dr = mkB(); nx = 0; }
function attach() {
  if (!dr || st !== 'play') return;
  tw.push({ ...dr, at: performance.now() }); sc = tw.length * 10 + (tH() | 0); dr = mkB(); nx = 0;
}
function die(r) { reason = r; if (sc > hi) hi = sc; st = 'over';
  for (let i = 0; i < 20; i++) pts.push({ x: W / 2, y: H / 3, vx: (Math.random() - .5) * 7, vy: (Math.random() - .5) * 7, r: 2 + Math.random() * 5, col: P[Math.random() * 5 | 0].col, l: 1 }); }
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'Space') { e.preventDefault(); st === 'play' ? attach() : go(); } });
addEventListener('keyup', e => { keys[e.code] = 0; });
c.addEventListener('click', () => st === 'play' ? attach() : st !== 'play' && go());
c.addEventListener('touchstart', e => { e.preventDefault(); st === 'play' ? attach() : go(); });
function upd() {
  const t = performance.now() / 1000;
  pts = pts.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += .12; p.l -= .018; return p.l > 0; });
  if (st !== 'play') return;
  nx *= .9;
  if (keys.ArrowLeft || keys.KeyA) nx -= 1;
  if (keys.ArrowRight || keys.KeyD) nx += 1;
  nx = Math.max(-5, Math.min(5, nx));
  if (dr) {
    dr.dy += .55; dr.y = -40 + dr.dy; dr.sp += .02;
    dr.x += Math.sin(dr.sp) * .7 + nx;
    dr.x = Math.max(dr.r + 8, Math.min(W - dr.r - 8, dr.x));
    if (dr.y > GND + 30) dr = mkB();
  }
  const f = nf();
  if (f > 0) lift += f * .12; else lift = Math.max(0, lift + f * .25);
  if (lift > H * .55 && tw.length) die('Tower floated away!');
}
function dBal(bx, by, r, col, sw) {
  const sx = Math.sin(sw) * 2.5; bx += sx;
  // string
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 1; x.beginPath();
  x.moveTo(bx, by + r); x.quadraticCurveTo(bx + Math.sin(sw * .6) * 4, by + r + 14, bx - sx * .4, by + r + 22); x.stroke();
  // body
  x.beginPath(); x.arc(bx, by, r, 0, Math.PI * 2);
  x.fillStyle = col + 'DD'; x.fill(); x.strokeStyle = col; x.lineWidth = 1.5; x.stroke();
  // knot
  x.beginPath(); x.moveTo(bx - 2.5, by + r); x.lineTo(bx, by + r + 3.5); x.lineTo(bx + 2.5, by + r);
  x.fillStyle = col; x.fill();
  // shine
  x.beginPath(); x.arc(bx - r * .28, by - r * .28, r * .2, 0, Math.PI * 2);
  x.fillStyle = 'rgba(255,255,255,.38)'; x.fill();
  return bx;
}
function dStr(x1, y1, x2, y2) {
  const t = performance.now() / 1000;
  x.strokeStyle = 'rgba(255,255,255,.1)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(x1, y1);
  x.quadraticCurveTo((x1 + x2) / 2 + Math.sin(t * 1.3) * 4, (y1 + y2) / 2, x2, y2); x.stroke();
}
function draw() {
  x.clearRect(0, 0, W, H);
  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a1a2e'); bg.addColorStop(1, '#16213e');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  // stars
  x.fillStyle = 'rgba(255,255,255,.06)';
  for (let i = 0; i < 30; i++) { const sx = (i * 137.5) % W, sy = (i * 91.3) % (H * .6);
    x.fillRect(sx, sy + Math.sin(t + i) * .5, 1.5, 1.5); }
  // ground
  x.fillStyle = 'rgba(255,255,255,.03)'; x.fillRect(0, GND, W, H - GND);
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(8, GND); x.lineTo(W - 8, GND); x.stroke();
  // anchor
  if (st === 'play' || st === 'over') {
    x.fillStyle = 'rgba(255,255,255,.1)'; x.font = '16px sans-serif'; x.textAlign = 'center';
    x.fillText('\u2693', W / 2, GND + 16);
  }
  // tower
  if (tw.length) {
    const base = GND - lift, ws = Math.sin(t * .7) * (2 + lift * .04);
    let cy = base;
    if (lift > 2) dStr(W / 2, GND, W / 2 + ws * .2, cy - tw[0].r);
    for (let i = 0; i < tw.length; i++) {
      const b = tw[i], ls = ws * (1 + i * .18);
      const bob = Math.sin(t * 1.1 + b.so) * (1.5 + lift * .01);
      const bx = W / 2 + ls + Math.sin(t * .5 + i * .9) * 2.5, by = cy - b.r + bob;
      if (i < tw.length - 1) {
        const n = tw[i + 1], ny2 = by - b.r - 3 - n.r;
        const nx2 = W / 2 + ws * (1 + (i + 1) * .18) + Math.sin(t * .5 + (i + 1) * .9) * 2.5;
        dStr(bx, by - b.r, nx2, ny2 + n.r + 3);
      }
      dBal(bx, by, b.r, b.col, t * 1.4 + b.so);
      // up arrows on high buoyancy
      if (b.buo > .6) { x.fillStyle = `rgba(255,255,255,${.1 + b.buo * .12})`; x.font = `${Math.max(8, b.r * .35)}px sans-serif`;
        x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(b.buo > .9 ? '\u2191\u2191' : '\u2191', bx + Math.sin(t * 1.4 + b.so) * 2.5, by); x.textBaseline = 'alphabetic'; }
      cy = by - b.r - 3;
    }
  }
  // drifter
  if (dr && st === 'play') {
    dBal(dr.x, dr.y, dr.r, dr.col, Math.sin(dr.sp) * .4 + t * 1.3);
    x.fillStyle = 'rgba(255,255,255,.35)'; x.font = '10px sans-serif'; x.textAlign = 'center';
    const lb = dr.buo > .85 ? 'HIGH LIFT' : dr.buo > .5 ? 'MED LIFT' : dr.buo > .2 ? 'LOW LIFT' : 'HEAVY';
    x.fillText(lb, dr.x, dr.y + dr.r + 34);
    x.fillStyle = `rgba(255,255,255,.07)`; x.font = '9px sans-serif';
    x.fillText('wt: ' + dr.wt.toFixed(2), dr.x, dr.y + dr.r + 46);
    // guide
    x.setLineDash([3, 4]); x.strokeStyle = 'rgba(255,255,255,.06)'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(dr.x, dr.y + dr.r + 50); x.lineTo(dr.x, GND - lift - tH()); x.stroke(); x.setLineDash([]);
  }
  // particles
  for (const p of pts) { x.globalAlpha = p.l; x.beginPath(); x.arc(p.x, p.y, p.r, 0, Math.PI * 2); x.fillStyle = p.col; x.fill(); } x.globalAlpha = 1;
  // HUD
  if (st === 'play' || st === 'over') {
    x.fillStyle = '#fff'; x.font = 'bold 18px sans-serif'; x.textAlign = 'left'; x.fillText('Score: ' + sc, 10, 26);
    x.font = '11px sans-serif'; x.fillStyle = 'rgba(255,255,255,.45)'; x.fillText('Best: ' + hi, 10, 42);
    x.textAlign = 'right'; x.fillText(tw.length + ' balloons', W - 10, 26);
    // lift meter
    const f = nf(), mx = W - 14, my = 38, mh = 55, mid = my + mh / 2;
    x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 1; x.strokeRect(mx - 7, my, 7, mh);
    const fv = Math.max(-1, Math.min(1, f * 2)), fc = fv > 0 ? '#FF6B6B88' : '#4ECDC488';
    x.fillStyle = fc;
    fv > 0 ? x.fillRect(mx - 6, mid - fv * mh / 2, 5, fv * mh / 2) : x.fillRect(mx - 6, mid, 5, -fv * mh / 2);
    x.fillStyle = 'rgba(255,255,255,.25)'; x.font = '8px sans-serif'; x.textAlign = 'center'; x.fillText('LIFT', mx - 3.5, my - 2);
    if (f > 0 && tw.length) { const a = Math.sin(t * 5) > 0 ? .65 : .25;
      x.fillStyle = `rgba(255,100,100,${a})`; x.font = 'bold 11px sans-serif'; x.textAlign = 'center'; x.fillText('\u26A0 LIFTING!', W / 2, GND + 20); }
  }
  if (st === 'intro') dIntro(t);
  if (st === 'over') dOver(t);
}
function dIntro(t) {
  x.fillStyle = 'rgba(0,0,0,.87)'; x.fillRect(0, 0, W, H); x.textAlign = 'center';
  x.fillStyle = '#4ECDC4'; x.font = 'bold 28px sans-serif'; x.fillText('BALLOON STACKER', W / 2, H * .1);
  x.fillStyle = 'rgba(255,255,255,.4)'; x.font = '13px sans-serif'; x.fillText('Balance buoyancy to build high!', W / 2, H * .1 + 24);
  P.forEach((p, i) => { const bx = W / 2 - 80 + i * 40, by = H * .21 + Math.sin(t * 1.2 + i) * 4;
    x.beginPath(); x.arc(bx, by, 13, 0, Math.PI * 2); x.fillStyle = p.col + 'CC'; x.fill();
    x.beginPath(); x.arc(bx - 3.5, by - 3.5, 2.8, 0, Math.PI * 2); x.fillStyle = 'rgba(255,255,255,.3)'; x.fill(); });
  const cy = H * .31; x.fillStyle = '#FFEAA7'; x.font = 'bold 12px sans-serif'; x.fillText('CONTROLS', W / 2, cy);
  [['SPACE / TAP', 'Attach balloon'], ['A / \u2190  D / \u2192', 'Nudge position']].forEach(([k, d], i) => {
    const y = cy + 18 + i * 18; x.font = '11px sans-serif';
    x.textAlign = 'right'; x.fillStyle = '#4ECDC4'; x.fillText(k, W / 2 - 6, y);
    x.textAlign = 'left'; x.fillStyle = 'rgba(255,255,255,.55)'; x.fillText(d, W / 2 + 6, y); });
  const hy = H * .43; x.textAlign = 'center'; x.fillStyle = '#FF6B6B'; x.font = 'bold 12px sans-serif'; x.fillText('HOW TO PLAY', W / 2, hy);
  x.font = '10.5px sans-serif'; x.fillStyle = 'rgba(255,255,255,.45)';
  ['Balloons drift down \u2014 tap to stack them', 'Each balloon has buoyancy pulling the tower up',
   'Heavier balloons at bottom keep it grounded', 'If net buoyancy > weight, tower floats \u2014 game over!',
   'Build the tallest stable tower you can', 'Score = height + balloons \u00D7 10'].forEach((r, i) => x.fillText(r, W / 2, hy + 16 + i * 15));
  const ly = H * .68; x.fillStyle = '#DDA0DD'; x.font = 'bold 11px sans-serif'; x.fillText('BALLOON TYPES', W / 2, ly);
  x.font = '10px sans-serif';
  P.forEach((p, i) => { const y = ly + 16 + i * 16;
    x.fillStyle = p.col; x.beginPath(); x.arc(W / 2 - 65, y - 3, 4.5, 0, Math.PI * 2); x.fill();
    x.textAlign = 'left'; x.fillStyle = 'rgba(255,255,255,.45)'; x.fillText(p.lb + ' \u2014 ' + p.desc, W / 2 - 54, y); });
  x.textAlign = 'center';
  const pulse = .4 + .6 * Math.sin(t * 3);
  x.globalAlpha = pulse; x.fillStyle = '#fff'; x.font = '15px sans-serif'; x.fillText('TAP or SPACE to start', W / 2, H * .94); x.globalAlpha = 1;
}
function dOver(t) {
  x.fillStyle = 'rgba(0,0,0,.72)'; x.fillRect(0, 0, W, H); x.textAlign = 'center';
  x.fillStyle = '#FF6B6B'; x.font = 'bold 30px sans-serif'; x.fillText('GAME OVER', W / 2, H / 2 - 55);
  x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '13px sans-serif'; x.fillText(reason, W / 2, H / 2 - 28);
  x.fillStyle = '#fff'; x.font = 'bold 22px sans-serif'; x.fillText('Score: ' + sc, W / 2, H / 2 + 8);
  x.font = '13px sans-serif'; x.fillStyle = 'rgba(255,255,255,.45)';
  x.fillText(tw.length + ' balloons  |  height: ' + (tH() | 0), W / 2, H / 2 + 32);
  if (sc >= hi && sc > 0) { x.fillStyle = '#FFEAA7'; x.font = 'bold 13px sans-serif'; x.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 60); }
  const pulse = .4 + .6 * Math.sin(t * 3);
  x.globalAlpha = pulse; x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '14px sans-serif'; x.fillText('Tap to retry', W / 2, H / 2 + 95); x.globalAlpha = 1;
}
(function loop() { upd(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
